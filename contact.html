<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Pimenta Cítrica</title>
    <meta name="description" content="Get in touch for workshops, content creation, speaking engagements, or collaboration opportunities.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pimentacitrica.com/contact">
    <meta property="og:title" content="Contact - Pimenta Cítrica">
    <meta property="og:description" content="Get in touch for workshops, content creation, speaking engagements, or collaboration opportunities.">
    <meta property="og:image" content="https://pimentacitrica.com/images/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://pimentacitrica.com/contact">
    <meta property="twitter:title" content="Contact - Pimenta Cítrica">
    <meta property="twitter:description" content="Get in touch for workshops, content creation, speaking engagements, or collaboration opportunities.">
    <meta property="twitter:image" content="https://pimentacitrica.com/images/og-image.jpg">
    <link rel="icon" type="image/png" href="images/Logo.png">
    <link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/components.js"></script>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <div id="header-placeholder"></div>
    <div id="accessibility-placeholder"></div>

    <main id="main" class="page-content">
        <div class="content-container">
            <div class="contact-content">
                <h1 class="page-title">DON'T BE SHY, SEND SOME LOVE</h1>
                <p class="lead">Workshops, collaborations, press requests or just a hello: tell me what you have in mind.</p>

                <div class="contact-form-wrapper">
                    <form class="contact-form" action="https://formspree.io/f/mzzjolww" method="POST">
                        <div class="form-group">
                            <label for="name">NAME</label>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="message">MESSAGE</label>
                            <textarea id="message" name="message" rows="6" required></textarea>
                        </div>

                        <!-- Honeypot for spam protection -->
                        <input type="text" name="_gotcha" style="display:none">

                        <button type="submit" class="submit-btn">SEND MESSAGE</button>
                        <p class="form-status" role="status" aria-live="polite" hidden></p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>
</body>
</html>
